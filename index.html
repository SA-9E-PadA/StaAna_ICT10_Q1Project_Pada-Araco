    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!--Header-->
    <div class="topnav">

    <!--Main Body-->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card app-card">
                    <div class="card-header text-center">
                        <i class="fa-solid fa-barcode fa-2x mb-2"></i>
                        <h1 class="mb-0">SKU Generator</h1>
                    </div>

                    <div class="card-body p-4">
                        <form id="sku-form">
                            <div class="mb-3">
                                <label for="category" class="form-label">
                                    <i class="fa-solid fa-tags me-1"></i> Category

                                </label>
                                <select id="category" class="form-select">
                                    <option value="Non Perishables">Non Perishables</option>
                                    <option value="Perishables  ">Perishables</option>
                                    <option value="Beverages">Beverages</option>
                                    <option value="Disposables">Disposables</option>
                                    <option value="Product Packaging">Product Packaging</option>
                                </select>
                            </div>

                            <div class="mb-3"> 
                                <label for="product_name" class="form-label">
                                    
                                    <i class="fa-solid fa-box me-1"></i> Product Name <p hidden class="text-danger" id="t_productalert"><sub>Please put in the product name</sub></p>
                                </label>
                                <input type="text" id="product_name" class="form-control" placeholder="e.g. Bottled Water">
                            </div>

                            

                            <div class="mb-3">
                                <label for="quantity" class="form-label">
                                    <i class="fa-solid fa-warehouse me-1"></i> Stock Quantity <p hidden class="text-danger" id="t_productcategory"><sub>Please put a proper quantity of stock</sub></p>
                                </label>
                                <input type="number" id="quantity" class="form-control" placeholder="e.g. 50" min="0">
                            </div>
                            
                            <!--Generation Button-->
                            <div class="d-grid">    
                                <input class="button mt-2" type="button" py-click="generate_sku" value="Generate SKU"
                                       class="btn btn-generate btn-lg text-white">
                            </div>
                        </form>

                        <hr class="my-4">
                        
                        <!--Bootstrap was made by the devil itself to make young and spry coders hate coding-->
                        <b><div hidden id="sku_output" class="specialcard card specialcard">
                            <div class="specialcard card-body specialcard">
                                <div class="specialcard card specialcard text-center" id="t_pid"><h1>stop-snooping-here</h1></div>
                                <h1 class="pt-3 ps-1" id="t_name"><b>PRODUCT NAME</b></h1>
                                <p class="ps-2" id="t_category">CATEGORY</p>
                                <p class="ps-2" id="t_quantity">QUANTITY: 67</p>
                            </div>
                        </div></b>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <!--Footer-->
    <footer class="text-center text-light py-4">
        <div class="container">
            <p class="mb-1">
                <i class="fa-solid fa-code me-1"></i>
                SKU Generator &mdash; 1st Quarter Project, created by Stefan Pada & Channnielle Araco

            </p>
        </div>
    </footer>
    <py-script src="main.py"></py-script>
</body>

</html>
