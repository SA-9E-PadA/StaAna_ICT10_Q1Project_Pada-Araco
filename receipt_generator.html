<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - 1st Quarter | Tea</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- PyScript -->
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="main.py">
    
</head>
<body>
  <div class="topnav">
        <a class="nav-logo" href="index.html">
        <img src="teaa.png" alt="Logo">
       </a>

        <div class="topnav-right">
            <a href="index.html">
                <i class="fa-solid fa-barcode me-1"></i> SKU Generator
            </a>
            <a class="active" href="receipt_generator.html">
            <i class="fa-solid fa-circle-info me-1"></i> Receipt Generator
            </a>
            </a>    
        </div>
    </div>

    <div class="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card app-card">
                        <div class="card-header text-center">
                            <i class="fa-solid fa-mug-hot fa-2x mb-2"></i>
                            <h1 class="mb-0">Chill & Brew</h1>
                            <small class="opacity-75"></small>
                        </div>

                        <div class="card-body p-4">
                            <h5 class="mb-3">
                                <i class="fa-solid fa-list-check me-1"></i> Menu
                            </h5>

                            <form id="order-form">
                                <div class="menu-item">
                                    <div>
                                        <input class="form-check-input" type="checkbox" id="item1" value="99">
                                        <label id="item1-label" for="item1">Earl Grey Tea</label>
                                    </div>
                                    <span class="price">₱67</span>
                                </div>

                                <div class="menu-item">
                                    <div>
                                        <input class="form-check-input" type="checkbox" id="item2" value="129">
                                        <label id="item2-label" for="item2">Chai</label>
                                    </div>
                                    <span class="price">₱200</span>
                                </div>

                                <div class="menu-item">
                                    <div>
                                        <input class="form-check-input" type="checkbox" id="item3" value="189">
                                        <label id="item3-label" for="item3">Chamomile</label>
                                    </div>
                                    <span class="price">₱150</span>
                                </div>

                                <div class="menu-item">
                                    <div>
                                        <input class="form-check-input" type="checkbox" id="item4" value="159">
                                        <label id="item4-label" for="item4">English Breakfast</label>
                                    </div>
                                    <span class="price">₱99</span>
                                </div>

                                <div class="menu-item">
                                    <div>
                                        <input class="form-check-input" type="checkbox" id="item5" value="129">
                                        <label id="item5-label" for="item5">Peppermint Tea</label>
                                    </div>
                                    <span class="price">₱156</span>
                                </div>

                                <div class="d-grid mt-4">
                                    <button type="button" py-click="create_order" class="btn btn-order btn-lg text-white">
                                        <i class="fa-solid fa-receipt me-1"></i> Create Order
                                    </button>
                                </div>
                            </form>

                            <hr class="my-4">

                            <div id="show">
                                <p class="text-muted text-center mb-0">Your order summary will appear here.</p>
                            </div>
                        </div>

                        <div class="card-footer text-center text-muted small py-3">
                            Select your items and click "Create Order"
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-light py-4" style="background-color: #24231b">
        <div class="container">
            <p class="mb-1">
                <i class="fa-solid fa-code me-1"></i>
                SKU Generator &mdash; 1st Quarter Project
            </p>
        </div>
    </footer>

    <py-script src="main.py"></py-script>

    <!-- Bootstrap JS bundle (needed for navbar toggle on mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
